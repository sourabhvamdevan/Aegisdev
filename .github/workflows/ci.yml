name: CI

# Zero-cost: GitHub Actions is free for public repositories.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint / static checks (ruff)
        run: ruff check app tests eval

      - name: Run tests
        run: python -m pytest -p no:warnings

      - name: Retrieval evaluation
        run: python -m eval.run_eval

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aegisdev:ci .
